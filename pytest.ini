[pytest]

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S


log_file = test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: Швидка перевірка основних сценаріїв
    regression: Повне регресійне тестування
    ui: Тести, що потребують багато часу
    api: Тести, що потребують багато часу

    old_style: Тести, які написані до введення pom, потребують refactoring
    modern: тести написані в сучасному(pom) стилі